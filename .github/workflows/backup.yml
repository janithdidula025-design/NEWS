name: Ada Derana Hourly Auto Backup

on:
  schedule:
    # සෑම පැයකටම වතාවක් Auto Run වේ
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: Run Derana Backup Scraper
        run: python scraper.py

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add derana_news.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto Backup: Updated Ada Derana News [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)
