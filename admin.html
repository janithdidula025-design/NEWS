<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>පරිපාලක පැනලය — ලංකා පුවත්</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abhaya+Libre:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700&family=Yaldevi:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1c2430; --ink-soft:#4a5262; --paper:#f2ede2; --paper-raised:#ffffff;
    --maroon:#8a2b25; --gold:#b8862f; --line:#d8cfb8; --green:#1f4d3c;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Noto Sans Sinhala','Yaldevi',sans-serif;}
  h1,h2,h3{font-family:'Abhaya Libre',serif;color:var(--ink);}
  a{color:inherit;}
  button{font-family:inherit;}

  header.top{background:var(--ink);color:#efe6cf;padding:16px 26px;display:flex;justify-content:space-between;align-items:center;}
  header.top h1{color:#efe6cf;font-size:20px;margin:0;}
  header.top a{font-size:13px;color:#c9a24a;text-decoration:none;border-bottom:1px dotted #c9a24a;}

  .wrap{max-width:900px;margin:0 auto;padding:34px 20px 60px;}

  .login-box{max-width:320px;margin:60px auto;text-align:center;background:#fff;padding:30px 26px;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.08);}
  .login-box p{color:var(--ink-soft);font-size:13.5px;margin-bottom:16px;}
  .login-box input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:3px;font-size:14px;margin-bottom:10px;font-family:'Noto Sans Sinhala',sans-serif;}
  .login-box button,.btn{width:100%;padding:11px;background:var(--maroon);color:#fff;border:none;border-radius:3px;font-weight:700;cursor:pointer;font-size:14px;}
  .login-box button:hover,.btn:hover{background:#a3342c;}
  .login-error{color:var(--maroon);font-size:12.5px;margin-top:6px;min-height:16px;}

  .admin-tabs{display:flex;gap:6px;margin-bottom:22px;border-bottom:1px solid var(--line);}
  .admin-tabs button{background:none;border:none;padding:10px 16px;font-weight:600;font-size:14px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;}
  .admin-tabs button.active{color:var(--maroon);border-bottom-color:var(--maroon);}

  .panel{background:#fff;border-radius:6px;padding:24px;box-shadow:0 2px 10px rgba(0,0,0,.05);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:5px;font-family:'Yaldevi',sans-serif;}
  .field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:'Noto Sans Sinhala',sans-serif;}
  .field textarea{resize:vertical;min-height:64px;}
  .form-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .save-msg{font-size:13px;color:var(--green);font-weight:600;margin-top:8px;min-height:18px;}
  .btn.wide{width:auto;padding:10px 22px;}

  .art-row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);}
  .art-row .thumb{width:60px;height:44px;flex-shrink:0;border-radius:3px;background:linear-gradient(135deg,#dfd6bd,#c9bd9d);object-fit:cover;}
  .art-row .meta{flex:1;min-width:0;}
  .art-row .meta .pos-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--maroon);background:#f4e6d8;padding:1px 7px;border-radius:2px;margin-bottom:3px;margin-right:4px;}
  .art-row .meta .cat-tag{display:inline-block;font-size:10.5px;font-weight:700;color:var(--green);background:#e4ede9;padding:1px 7px;border-radius:2px;margin-bottom:3px;}
  .art-row .meta h4{font-size:14.5px;margin:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .art-row .acts{display:flex;gap:6px;flex-shrink:0;}
  .art-row .acts button{background:none;border:1px solid var(--line);border-radius:3px;padding:5px 10px;font-size:12.5px;cursor:pointer;}
  .art-row .acts button:hover{border-color:var(--maroon);color:var(--maroon);}
  .art-row .acts button.del:hover{border-color:#a3342c;color:#a3342c;}
  .empty-note{color:var(--ink-soft);font-size:13.5px;font-style:italic;padding:8px 0;}

  .ticker-editor .t-row{display:flex;gap:8px;margin-bottom:8px;}
  .ticker-editor .t-row input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:3px;font-size:14px;font-family:'Noto Sans Sinhala',sans-serif;}
  .ticker-editor .t-row button{background:none;border:1px solid var(--line);border-radius:3px;padding:0 12px;cursor:pointer;color:var(--maroon);}
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible{outline:2px solid var(--maroon);outline-offset:2px;}
</style>
</head>
<body>

  <header class="top">
    <h1>ලංකා පුවත් · පරිපාලක පැනලය</h1>
    <a href="index.html">← වෙබ් අඩවියට යන්න</a>
  </header>

  <div class="wrap">

    <div id="loginView" class="login-box">
      <p>ඉදිරියට යාමට රහස්පදය ඇතුළත් කරන්න.</p>
      <input type="password" id="pwInput" placeholder="රහස්පදය" onkeydown="if(event.key==='Enter')tryLogin()">
      <button onclick="tryLogin()">ඇතුල් වන්න</button>
      <div class="login-error" id="loginErr"></div>
    </div>

    <div id="dashView" style="display:none;">
      <div id="sheetWarning" style="display:none;background:#fdf0e3;border:1px solid var(--gold);color:#7a5a1e;padding:10px 14px;border-radius:4px;font-size:13px;margin-bottom:18px;">
        ⚠ Google Sheet එකට connect වී නැත — දැනට save වෙන්නේ මේ browser එකේ පමණි. SCRIPT_URL එක admin.html code එකේ set කරන්න.
      </div>
      <div class="admin-tabs">
        <button class="active" data-tab="articles" onclick="switchTab('articles')">පුවත් කළමනාකරණය</button>
        <button data-tab="ticker" onclick="switchTab('ticker')">නවතම පට්ටිය (Ticker)</button>
      </div>

      <div id="tab-articles">
        <div class="panel">
          <h3 style="font-size:16px;margin:0 0 12px;">නව පුවතක් එකතු කරන්න</h3>
          <div class="form-row">
            <div class="field"><label>කාණ්ඩය</label><select id="f-category"></select></div>
            <div class="field"><label>මුල් පිටුවේ පෙනුම</label>
              <select id="f-position">
                <option value="hero">ප්‍රධාන පුවත (Hero)</option>
                <option value="side">පැති පුවත (Side)</option>
                <option value="grid" selected>සාරාංශ කාණ්ඩ (Grid)</option>
                <option value="none">මුල් පිටුවේ නොපෙන්වන්න</option>
              </select>
            </div>
          </div>
          <div class="field"><label>ශීර්ෂ පාඨය</label><input id="f-title" placeholder="පුවත් ශීර්ෂය"></div>
          <div class="field"><label>විස්තරය</label><textarea id="f-desc" placeholder="කෙටි විස්තරයක්..."></textarea></div>
          <div class="field"><label>රූප URL (විකල්ප)</label><input id="f-img" placeholder="https://..."></div>
          <input type="hidden" id="f-id">
          <button class="btn wide" onclick="saveArticle()">සුරකින්න</button>
          <div class="save-msg" id="artMsg"></div>
        </div>

        <h3 style="font-size:16px;margin:26px 0 4px;">දැනට ඇති පුවත්</h3>
        <div class="panel" id="articleListPanel"><div id="articleList"></div></div>
      </div>

      <div id="tab-ticker" style="display:none;">
        <div class="panel">
          <h3 style="font-size:16px;margin:0 0 12px;">නවතම පට්ටියේ පෙළ</h3>
          <div class="ticker-editor" id="tickerEditor"></div>
          <button class="btn wide" onclick="addTickerRow('')">+ පේළියක් එකතු කරන්න</button>
          <br><br>
          <button class="btn wide" onclick="saveTicker()">සුරකින්න</button>
          <div class="save-msg" id="tickerMsg"></div>
        </div>
      </div>
    </div>

  </div>

<script>
const ADMIN_PASSWORD = "lanka2026";

// Google Apps Script Web App එකේ URL එක මෙතන paste කරන්න (Deploy > Web app):
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxPKA-lhmoD0kxTYOzJzZx8Krdxy3XXL1_UG2Ow1NRHmDol26-0vrIvtdbr26n7Q3If/exec";

const STORAGE_KEY = "site-data";
const CATEGORIES = ['ප්‍රධාන පුවත්','දේශපාලනය','ක්‍රීඩා','ව්‍යාපාර','ලෝකය','විනෝදාංශය','තාක්ෂණය','ජීවන රටාව'];

const DEFAULT_DATA = { ticker: [], articles: [] };

let siteData = null;
let sheetConnected = false;

function sheetReady(){ return SCRIPT_URL && SCRIPT_URL.indexOf('PASTE_YOUR') === -1; }

async function loadData(){
  if(sheetReady()){
    try{
      const res = await fetch(SCRIPT_URL, {method:'GET'});
      const json = await res.json();
      if(json && json.articles){
        siteData = json;
        sheetConnected = true;
        if(!siteData.articles) siteData.articles = [];
        if(!siteData.ticker) siteData.ticker = [];
        return;
      }
    }catch(e){
      console.error('Sheet fetch failed:', e);
    }
  }
  sheetConnected = false;
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    siteData = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(DEFAULT_DATA));
  }catch(e){
    siteData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  if(!siteData.articles) siteData.articles = [];
  if(!siteData.ticker) siteData.ticker = [];
}

async function callSheet(payload){
  // text/plain content-type avoids a CORS preflight, which Apps Script doesn't handle.
  await fetch(SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  });
}

function persist(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(siteData)); }
  catch(e){ console.error("Storage save failed", e); }
}
function esc(s){ return (s||"").replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function tryLogin(){
  const pw = document.getElementById('pwInput').value;
  if(pw === ADMIN_PASSWORD){
    document.getElementById('loginErr').textContent = 'පූරණය වෙමින්...';
    await loadData();
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('dashView').style.display = 'block';
    if(!sheetReady()){
      document.getElementById('sheetWarning').style.display = 'block';
    }
    populateCategorySelect();
    renderArticleList();
    renderTickerEditor();
  }else{
    document.getElementById('loginErr').textContent = 'රහස්පදය වැරදියි. නැවත උත්සාහ කරන්න.';
  }
}
function switchTab(tab){
  document.querySelectorAll('.admin-tabs button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.getElementById('tab-articles').style.display = tab==='articles' ? 'block':'none';
  document.getElementById('tab-ticker').style.display = tab==='ticker' ? 'block':'none';
}
function populateCategorySelect(){
  document.getElementById('f-category').innerHTML =
    CATEGORIES.filter(c=>c!=='ප්‍රධාන පුවත්').map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
}

function renderArticleList(){
  const posLabel = {hero:'Hero',side:'Side',grid:'Grid',none:'—'};
  document.getElementById('articleList').innerHTML = siteData.articles.map(a=>`
    <div class="art-row">
      ${a.img ? `<img class="thumb" src="${esc(a.img)}" onerror="this.style.display='none'">` : `<div class="thumb"></div>`}
      <div class="meta">
        <span class="cat-tag">${esc(a.category)}</span><span class="pos-tag">${posLabel[a.position]||a.position}</span>
        <h4>${esc(a.title)}</h4>
      </div>
      <div class="acts">
        <button onclick="editArticle('${a.id}')">සංස්කරණය</button>
        <button class="del" onclick="deleteArticle('${a.id}')">මකන්න</button>
      </div>
    </div>`).join('') || '<div class="empty-note">පුවත් නොමැත</div>';
}

function editArticle(id){
  const a = siteData.articles.find(x=>x.id===id);
  if(!a) return;
  document.getElementById('f-id').value = a.id;
  document.getElementById('f-category').value = a.category;
  document.getElementById('f-position').value = a.position;
  document.getElementById('f-title').value = a.title||'';
  document.getElementById('f-desc').value = a.desc||'';
  document.getElementById('f-img').value = a.img||'';
  document.getElementById('artMsg').textContent = '';
  window.scrollTo({top:0,behavior:'smooth'});
}
async function deleteArticle(id){
  siteData.articles = siteData.articles.filter(a=>a.id!==id);
  persist();
  renderArticleList();
  if(sheetConnected){
    try{ await callSheet({action:'deleteArticle', id}); }
    catch(e){ console.error(e); }
  }
}
async function saveArticle(){
  const title = document.getElementById('f-title').value.trim();
  if(!title){
    document.getElementById('artMsg').style.color = '#a3342c';
    document.getElementById('artMsg').textContent = 'ශීර්ෂ පාඨයක් ඇතුළත් කරන්න.';
    return;
  }
  const id = document.getElementById('f-id').value;
  const data = {
    category: document.getElementById('f-category').value,
    position: document.getElementById('f-position').value,
    title,
    desc: document.getElementById('f-desc').value.trim(),
    img: document.getElementById('f-img').value.trim()
  };
  if(id){
    data.id = id;
    const idx = siteData.articles.findIndex(a=>a.id===id);
    if(idx>-1) siteData.articles[idx] = {...siteData.articles[idx], ...data};
  }else{
    data.id = 'a' + Date.now();
    siteData.articles.push(data);
  }
  persist();
  renderArticleList();
  document.getElementById('artMsg').style.color = 'var(--green)';
  document.getElementById('artMsg').textContent = sheetConnected ? 'සුරකිමින්... (Sheet එකට)' : 'සුරැකිණි ✓ (browser එකේ පමණි)';

  if(sheetConnected){
    try{
      await callSheet({action:'saveArticle', article:data});
      document.getElementById('artMsg').textContent = 'සුරැකිණි ✓ (Google Sheet එකට)';
    }catch(e){
      console.error(e);
      document.getElementById('artMsg').style.color = '#a3342c';
      document.getElementById('artMsg').textContent = 'Sheet එකට save කිරීම අසාර්ථකයි — connection එක බලන්න.';
    }
  }

  document.getElementById('f-id').value = '';
  document.getElementById('f-title').value='';
  document.getElementById('f-desc').value='';
  document.getElementById('f-img').value='';
  setTimeout(()=>{ document.getElementById('artMsg').textContent=''; }, 3500);
}

function renderTickerEditor(){
  const wrap = document.getElementById('tickerEditor');
  wrap.innerHTML = '';
  siteData.ticker.forEach(text=> addTickerRow(text));
  if(siteData.ticker.length === 0) addTickerRow('');
}
function addTickerRow(value){
  const wrap = document.getElementById('tickerEditor');
  const row = document.createElement('div');
  row.className = 't-row';
  row.innerHTML = `<input value="${esc(value)}" placeholder="පුවත් පේළිය..."><button onclick="this.parentElement.remove()">✕</button>`;
  wrap.appendChild(row);
}
async function saveTicker(){
  const rows = Array.from(document.querySelectorAll('#tickerEditor .t-row input'));
  siteData.ticker = rows.map(r=>r.value.trim()).filter(Boolean);
  persist();
  const msg = document.getElementById('tickerMsg');
  msg.style.color = 'var(--green)';
  msg.textContent = sheetConnected ? 'සුරකිමින්... (Sheet එකට)' : 'සුරැකිණි ✓ (browser එකේ පමණි)';
  if(sheetConnected){
    try{
      await callSheet({action:'saveTicker', ticker: siteData.ticker});
      msg.textContent = 'සුරැකිණි ✓ (Google Sheet එකට)';
    }catch(e){
      console.error(e);
      msg.style.color = '#a3342c';
      msg.textContent = 'Sheet එකට save කිරීම අසාර්ථකයි.';
    }
  }
  setTimeout(()=>{ msg.textContent=''; }, 3500);
}
</script>
</body>
</html>
