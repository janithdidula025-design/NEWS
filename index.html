<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ලංකාපුවත් | LankaNews</title>
  
  <!-- Modern Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Sinhala:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --maroon: #800000;
      --dark-maroon: #5a0000;
      --light-maroon: #fdf2f2;
      --gold: #d4af37;
      --gold-hover: #b59328;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --text-main: #0f172a;
      --text-muted: #475569;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -2px rgba(0,0,0,0.05);
      --radius: 12px;
      --radius-sm: 6px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body { 
      font-family: 'Inter', 'Noto Sans Sinhala', -apple-system, BlinkMacSystemFont, sans-serif; 
      background-color: var(--bg-color); 
      color: var(--text-main); 
      line-height: 1.6; 
      -webkit-font-smoothing: antialiased;
    }

    /* Top Utility Bar */
    .utility-bar { 
      background-color: #0f172a; 
      color: #94a3b8; 
      padding: 8px 5%; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 13px; 
      font-weight: 500;
      border-bottom: 1px solid #1e293b;
      flex-wrap: wrap;
      gap: 10px;
    }
    
    .lang-btn { 
      background: #1e293b; 
      border: 1px solid #334155; 
      color: #cbd5e1; 
      padding: 4px 10px; 
      cursor: pointer; 
      border-radius: var(--radius-sm); 
      margin-left: 2px; 
      font-size: 12px; 
      font-weight: 600;
      transition: all 0.2s ease; 
    }
    .lang-btn:hover { background-color: #334155; color: #fff; }
    .lang-btn.active { background-color: var(--gold); color: #000; border-color: var(--gold); }

    /* Main Header */
    header { 
      background-color: var(--card-bg); 
      border-bottom: 1px solid var(--border-color); 
      padding: 20px 5%; 
      text-align: center; 
    }
    .eyebrow { 
      font-size: 11px; 
      letter-spacing: 1.2px; 
      color: var(--text-muted); 
      text-transform: uppercase; 
      font-weight: 600;
      margin-bottom: 4px;
    }
    .brand { 
      font-size: clamp(32px, 6vw, 48px); 
      font-weight: 800; 
      color: var(--maroon); 
      text-decoration: none; 
      display: inline-block; 
      letter-spacing: -1px;
      line-height: 1.1;
      transition: transform 0.2s ease;
    }
    .brand:hover { transform: scale(1.01); }
    .brand span { color: #0f172a; }
    .tagline { font-size: 13px; color: var(--text-muted); font-style: normal; margin-top: 6px; }

    /* Search Bar */
    .search-box { margin-top: 16px; display: flex; justify-content: center; width: 100%; }
    .search-box input { 
      padding: 10px 14px; 
      width: 100%;
      max-width: 320px; 
      border: 1px solid var(--border-color); 
      border-radius: var(--radius) 0 0 var(--radius); 
      outline: none; 
      font-size: 14px;
      background: var(--bg-color);
      transition: all 0.2s ease;
    }
    .search-box input:focus { border-color: var(--maroon); background: #fff; }
    .search-box button { 
      padding: 10px 18px; 
      background: var(--maroon); 
      color: #fff; 
      border: none; 
      border-radius: 0 var(--radius) var(--radius) 0; 
      cursor: pointer; 
      font-size: 14px;
      transition: background 0.2s ease;
    }
    .search-box button:hover { background: var(--dark-maroon); }

    /* Navigation Bar */
    nav { 
      background-color: var(--maroon); 
      position: sticky; 
      top: 0; 
      z-index: 100; 
      box-shadow: var(--shadow-md); 
    }
    nav ul { 
      display: flex; 
      list-style: none; 
      overflow-x: auto; 
      -webkit-overflow-scrolling: touch;
      max-width: 1200px; 
      margin: 0 auto; 
      padding: 0 10px; 
      scrollbar-width: none; 
    }
    nav ul::-webkit-scrollbar { display: none; }
    nav li a { 
      display: block; 
      color: #f8fafc; 
      padding: 12px 16px; 
      text-decoration: none; 
      white-space: nowrap; 
      font-size: 14px; 
      font-weight: 600;
      cursor: pointer; 
      transition: all 0.2s ease; 
      border-bottom: 3px solid transparent;
    }
    nav li a:hover, nav li.active a { 
      background-color: rgba(0,0,0,0.15); 
      color: var(--gold); 
      border-bottom-color: var(--gold);
    }

    /* Ticker */
    .ticker-container { 
      background: var(--card-bg); 
      border-bottom: 1px solid var(--border-color); 
      display: flex; 
      align-items: center; 
      overflow: hidden; 
      height: 40px; 
      box-shadow: var(--shadow-sm);
    }
    .ticker-label { 
      background: var(--maroon); 
      color: #fff; 
      padding: 0 14px; 
      height: 100%; 
      display: flex; 
      align-items: center; 
      font-size: 12px; 
      font-weight: 700; 
      letter-spacing: 0.5px;
      white-space: nowrap; 
      z-index: 2;
    }
    .ticker-text { display: flex; white-space: nowrap; animation: ticker 80s linear infinite; }
    .ticker-text span { padding: 0 20px; font-size: 13.5px; color: var(--text-main); font-weight: 500; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }

    /* Container Layout */
    .container { max-width: 1200px; margin: 24px auto; padding: 0 16px; }

    /* Hero Section */
    .hero-grid { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 20px; 
      margin-bottom: 30px; 
    }

    .hero-main { 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      overflow: hidden; 
      box-shadow: var(--shadow-sm); 
      cursor: pointer; 
      border: 1px solid var(--border-color); 
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .hero-main:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); }
    .hero-main img, .hero-main .ph { 
      width: 100%; 
      height: 240px; 
      object-fit: cover; 
      background: #e2e8f0; 
      display: block; 
    }
    .hero-main .kicker { color: var(--maroon); font-weight: 700; font-size: 11px; padding: 16px 16px 0; letter-spacing: 0.5px; text-transform: uppercase; }
    .hero-main h2 { padding: 6px 16px 10px; font-size: clamp(20px, 4vw, 26px); color: var(--text-main); line-height: 1.3; font-weight: 800; }
    .hero-main .dek { padding: 0 16px 12px; color: var(--text-muted); font-size: 14px; }
    .hero-main .byline { padding: 0 16px 16px; font-size: 12px; font-weight: 500; color: #94a3b8; }

    .hero-side { display: flex; flex-direction: column; gap: 12px; }
    .side-item { 
      background: var(--card-bg); 
      display: flex; 
      gap: 12px; 
      padding: 10px; 
      border-radius: var(--radius); 
      border: 1px solid var(--border-color); 
      cursor: pointer; 
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }
    .side-item:hover { transform: translateX(4px); border-color: #cbd5e1; box-shadow: var(--shadow-md); }
    .side-item img, .side-item .ph { width: 85px; height: 85px; object-fit: cover; border-radius: var(--radius-sm); background: #e2e8f0; flex-shrink: 0; }
    .side-item .kicker { font-size: 10px; color: var(--maroon); font-weight: 700; text-transform: uppercase; margin-bottom: 2px; }
    .side-item h3 { font-size: 13.5px; line-height: 1.4; color: var(--text-main); font-weight: 700; }

    /* Cards Grid */
    .section-title { 
      font-size: 18px; 
      font-weight: 800; 
      margin-bottom: 16px; 
      border-bottom: 2px solid var(--maroon); 
      padding-bottom: 6px; 
      color: var(--maroon); 
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-grid { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 16px; 
      margin-bottom: 32px; 
    }
    .card { 
      background: var(--card-bg); 
      border-radius: var(--radius); 
      border: 1px solid var(--border-color); 
      overflow: hidden; 
      cursor: pointer; 
      transition: all 0.25s ease; 
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); box-shadow: var(--shadow-lg); border-color: #cbd5e1; }
    .card img, .card .ph { width: 100%; height: 180px; object-fit: cover; background: #e2e8f0; }
    .card .kicker { font-size: 11px; color: var(--maroon); font-weight: 700; padding: 12px 14px 0; text-transform: uppercase; }
    .card h3 { font-size: 15px; padding: 6px 14px; line-height: 1.4; color: var(--text-main); font-weight: 700; }
    .card p { font-size: 13px; color: var(--text-muted); padding: 0 14px 14px; margin-top: auto; }

    /* Category View Header & Load More */
    .back-btn, .load-more-btn { 
      background: var(--maroon); 
      color: #fff; 
      border: none; 
      padding: 10px 20px; 
      border-radius: var(--radius-sm); 
      cursor: pointer; 
      display: inline-flex; 
      align-items: center;
      gap: 6px;
      font-size: 14px; 
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .back-btn { margin-bottom: 20px; }
    .back-btn:hover, .load-more-btn:hover { background: var(--dark-maroon); }
    
    .load-more-container {
      text-align: center;
      margin: 20px 0 40px;
    }

    /* Split Section (Sports & Business) */
    .split-section { 
      display: grid; 
      grid-template-columns: 1fr; 
      gap: 20px; 
      margin-bottom: 32px; 
    }
    .strip-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }
    .strip-row { 
      display: flex; 
      align-items: center; 
      padding: 10px 0; 
      border-bottom: 1px solid var(--border-color); 
      cursor: pointer; 
      font-size: 14px; 
      transition: transform 0.2s ease;
    }
    .strip-row:last-child { border-bottom: none; }
    .strip-row:hover { transform: translateX(4px); }
    .strip-row:hover a { color: var(--maroon); }
    .strip-row .num { font-weight: 800; color: var(--maroon); width: 26px; font-size: 15px; flex-shrink: 0; }
    .strip-row a { color: var(--text-main); font-weight: 600; text-decoration: none; }

    /* Modal (Popup) */
    .modal { 
      display: none; 
      position: fixed; 
      top:0; left:0; width:100%; height:100%; 
      background: rgba(15, 23, 42, 0.75); 
      backdrop-filter: blur(4px);
      z-index: 1000; 
      justify-content: center; 
      align-items: center; 
      padding: 16px; 
    }
    .modal.active { display: flex; }
    .modal-box { 
      background: var(--card-bg); 
      max-width: 680px; 
      width: 100%; 
      max-height: 85vh; 
      overflow-y: auto; 
      border-radius: var(--radius); 
      padding: 20px; 
      position: relative; 
      box-shadow: var(--shadow-lg);
      animation: modalFadeIn 0.25s ease-out;
    }
    @keyframes modalFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-close { 
      position: absolute; 
      top: 12px; right: 12px; 
      font-size: 20px; 
      cursor: pointer; 
      border: none; 
      background: var(--bg-color); 
      width: 32px; height: 32px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted);
      transition: all 0.2s ease;
      z-index: 5;
    }
    .modal-close:hover { background: #e2e8f0; color: var(--text-main); }
    .modal-box img { width: 100%; max-height: 360px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 14px; }

    .empty-note { padding: 24px; text-align: center; color: var(--text-muted); font-style: italic; width: 100%; background: var(--card-bg); border-radius: var(--radius); border: 1px dashed var(--border-color); }

    /* Footer */
    footer { 
      background: #0f172a; 
      color: #94a3b8; 
      padding: 32px 5% 20px; 
      font-size: 13.5px; 
      border-top: 4px solid var(--maroon);
    }
    .footer-links { display: flex; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
    .footer-links a { color: #cbd5e1; text-decoration: none; font-weight: 500; transition: color 0.2s ease; }
    .footer-links a:hover { color: var(--gold); }
    #txt-footer-copy { color: #f8fafc; font-weight: 600; }

    /* Responsive Breakpoints */
    @media (min-width: 640px) {
      .card-grid { grid-template-columns: repeat(2, 1fr); }
      .split-section { grid-template-columns: repeat(2, 1fr); }
      .hero-main img, .hero-main .ph { height: 300px; }
      .modal-box { padding: 28px; }
    }

    @media (min-width: 850px) {
      .hero-grid { grid-template-columns: 2fr 1.1fr; gap: 24px; }
      .hero-main img, .hero-main .ph { height: 360px; }
    }

    @media (min-width: 1024px) {
      .card-grid { grid-template-columns: repeat(3, 1fr); gap: 24px; }
    }
  </style>
</head>

        footerCopy: "ලංකාපුවත් — සියලු හිමිකම් ඇවිරිණි",
        about: "අප ගැන", contact: "සම්බන්ධ වන්න", privacy: "පෞද්ගලිකත්ව ප්‍රතිපත්තිය",
        categories: ['ප්‍රධාන පුවත්','දේශපාලනය','ක්‍රීඩා','ව්‍යාපාර','ලෝකය','විනෝදාංශය','තාක්ෂණය','ජීවන රටාව']
      },
      en: {
        eyebrow: "Daily Publication · Colombo",
        brand1: "Lanka", brand2: "News",
        tagline: "What happens island-wide, only what truly matters",
        breaking: "BREAKING",
        summaryTitle: "News Summary",
        sportsBizTitle: "Sports & Business",
        sportsHdr: "Sports", bizHdr: "Business",
        backHome: "← Back to Home",
        loadMore: "Load More News",
        searchPlaceholder: "Search...",
        noNews: "No news available in this category",
        byline: "By Staff · 3 min read",
        footerCopy: "LankaNews — All Rights Reserved",
        about: "About Us", contact: "Contact", privacy: "Privacy Policy",
        categories: ['Main News','Politics','Sports','Business','World','Entertainment','Technology','Lifestyle']
      },
      ta: {
        eyebrow: "தினசரி வெளியீடு · கொழும்பு",
        brand1: "லங்கா", brand2: "செய்திகள்",
        tagline: "தீவு முழுவதும் நடப்பவை, உண்மையில் முக்கியமானவை மட்டுமே",
        breaking: "முக்கிய செய்தி",
        summaryTitle: "செய்திச் சுருக்கம்",
        sportsBizTitle: "விளையாட்டு & வணிகம்",
        sportsHdr: "விளையாட்டு", bizHdr: "வணிகம்",
        backHome: "← முகப்புக்குச் செல்லவும்",
        loadMore: "மேலும் செய்திகளைப் பார்க்க",
        searchPlaceholder: "தேடுக...",
        noNews: "இந்த பிரிவில் செய்திகள் எதுவும் නැත",
        byline: "செய்திப் பிரிவு · 3 நிமிட வாசிப்பு",
        footerCopy: "லங்கா நியூஸ் — அனைத்து உரிமைகளும் பாதுகாக்கப்பட்டவை",
        about: "எங்களைப் பற்றி", contact: "தொடர்பு கொள்ள", privacy: "தனியுரிமைக் கொள்கை",
        categories: ['முக்கிய செய்திகள்','அரசியல்','விளையாட்டு','வணிகம்','உலகம்','பொழுதுபோக்கு','தொழில்நுட்பம்','வாழ்க்கைமுறை']
      }
    };

    let currentLang = localStorage.getItem(LANG_KEY) || 'si';
    let siteData = { ticker: [], articles: [] };
    let currentCat = 'home';

    // Pagination Controls (50+ News Handling)
    let categoryFilteredArticles = [];
    let currentCategoryPage = 1;
    const ITEMS_PER_PAGE = 12;

    function updateDate() {
      const d = new Date();
      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      const langCode = currentLang === 'si' ? 'si-LK' : currentLang === 'ta' ? 'ta-LK' : 'en-US';
      document.getElementById('today-date').textContent = d.toLocaleDateString(langCode, options);
      document.getElementById('year').textContent = d.getFullYear();
    }

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem(LANG_KEY, lang);
      
      document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-lang-${lang}`).classList.add('active');
      document.documentElement.lang = lang;
      
      const t = i18n[lang];
      document.getElementById('txt-eyebrow').textContent = t.eyebrow;
      document.getElementById('txt-brand-1').textContent = t.brand1;
      document.getElementById('txt-brand-2').textContent = t.brand2;
      document.getElementById('txt-tagline').textContent = t.tagline;
      document.getElementById('txt-breaking').textContent = t.breaking;
      document.getElementById('txt-summary-title').textContent = t.summaryTitle;
      document.getElementById('txt-sports-biz-title').textContent = t.sportsBizTitle;
      document.getElementById('txt-sports-hdr').textContent = t.sportsHdr;
      document.getElementById('txt-biz-hdr').textContent = t.bizHdr;
      document.getElementById('txt-back-home').textContent = t.backHome;
      document.getElementById('txt-load-more').textContent = t.loadMore;
      document.getElementById('searchInput').placeholder = t.searchPlaceholder;
      document.getElementById('txt-footer-copy').textContent = t.footerCopy;
      document.getElementById('txt-about').textContent = t.about;
      document.getElementById('txt-contact').textContent = t.contact;
      document.getElementById('txt-privacy').textContent = t.privacy;

      updateDate();
      buildNav();
      if(siteData) renderSite();
    }

    async function loadData(){
      if(SCRIPT_URL && SCRIPT_URL.trim() !== ""){
        try{
          const res = await fetch(SCRIPT_URL, {
            method: 'GET',
            redirect: 'follow'
          });
          const json = await res.json();
          if(json && (json.articles || json.ticker)){
            siteData = {
              ticker: json.ticker || [],
              articles: json.articles || []
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(siteData));
            renderSite();
            return;
          }
        }catch(e){
          console.error('Sheet fetch failed:', e);
        }
      }
      const raw = localStorage.getItem(STORAGE_KEY);
      siteData = raw ? JSON.parse(raw) : { ticker: [], articles: [] };
      renderSite();
    }

    function esc(s){ return (s||"").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    
    function imgTag(src, cls){
      if(src) return `<img class="ph ${cls||''}" src="${esc(src)}" alt="" onerror="this.style.display='none'">`;
      return `<div class="ph ${cls||''}"></div>`;
    }

    function buildNav(){
      const nav = document.getElementById('navList');
      const cats = i18n[currentLang].categories;
      nav.innerHTML = cats.map((c, i)=>{
        const key = i === 0 ? 'home' : c;
        return `<li data-navkey="${esc(key)}"><a onclick="navigateTo('${esc(key)}')">${esc(c)}</a></li>`;
      }).join('');
    }

    function navigateTo(catKey){
      currentCat = catKey;
      document.querySelectorAll('#navList li').forEach(li=>{
        li.classList.toggle('active', li.dataset.navkey === catKey);
      });
      
      if(catKey === 'home'){
        document.getElementById('homeView').style.display = 'block';
        document.getElementById('categoryView').style.display = 'none';
      } else {
        document.getElementById('homeView').style.display = 'none';
        document.getElementById('categoryView').style.display = 'block';
        document.getElementById('catTitle').textContent = catKey;
        
        // Filter Category Items (Supports up to 50+ entries easily)
        categoryFilteredArticles = (siteData.articles || []).filter(a => 
          a.category && a.category.trim().toLowerCase() === catKey.trim().toLowerCase()
        );

        currentCategoryPage = 1;
        renderCategoryGrid();
      }
      window.scrollTo({top:0, behavior:'smooth'});
    }

    function renderCategoryGrid() {
      const catGrid = document.getElementById('catGrid');
      const loadMoreBox = document.getElementById('loadMoreBox');

      if (categoryFilteredArticles.length === 0) {
        catGrid.innerHTML = `<div class="empty-note">${i18n[currentLang].noNews}</div>`;
        loadMoreBox.style.display = 'none';
        return;
      }

      const visibleItems = categoryFilteredArticles.slice(0, currentCategoryPage * ITEMS_PER_PAGE);

      catGrid.innerHTML = visibleItems.map(a => `
        <article class="card" onclick="openModal('${esc(a.id)}')">
          ${imgTag(a.img)}
          <div class="kicker">${esc(a.category)}</div>
          <h3>${esc(a.title)}</h3>
          <p>${esc(a.desc)}</p>
        </article>`).join('');

      // Toggle Load More Button
      if (visibleItems.length < categoryFilteredArticles.length) {
        loadMoreBox.style.display = 'block';
      } else {
        loadMoreBox.style.display = 'none';
      }
    }

    function loadMoreCategoryItems() {
      currentCategoryPage++;
      renderCategoryGrid();
    }

    function renderSite(){
      if(!siteData) return;
      const t = i18n[currentLang];
      const arts = siteData.articles || [];
      const hero = arts.find(a=>a.position==='hero') || arts[0];
      const sides = arts.filter(a=>a.position==='side').slice(0,4);
      const grid = arts.filter(a=>a.position==='grid').slice(0,6);
      
      const sports = arts.filter(a=>['ක්‍රීඩා','sports','விளையாட்டு'].includes((a.category||'').trim().toLowerCase())).slice(0,6);
      const biz = arts.filter(a=>['ව්‍යාපාර','business','வணிகம்'].includes((a.category||'').trim().toLowerCase())).slice(0,6);

      document.getElementById('heroSection').innerHTML = `
        <article class="hero-main" onclick="${hero ? `openModal('${hero.id}')` : ''}">
          ${hero ? imgTag(hero.img) : `<div class="ph"></div>`}
          <div class="kicker">${esc(hero ? hero.category : t.categories[0])}</div>
          <h2>${esc(hero ? hero.title : t.noNews)}</h2>
          <p class="dek">${esc(hero ? hero.desc : '')}</p>
          <div class="byline">${t.byline}</div>
        </article>
        <aside class="hero-side">
          ${sides.map(s=>`
            <div class="side-item" onclick="openModal('${s.id}')">
              ${imgTag(s.img)}
              <div><div class="kicker">${esc(s.category)}</div><h3>${esc(s.title)}</h3></div>
            </div>`).join('') || `<div class="empty-note">${t.noNews}</div>`}
        </aside>`;

      document.getElementById('gridSection').innerHTML = grid.map(g=>`
        <article class="card" onclick="openModal('${g.id}')">
          ${imgTag(g.img)}
          <div class="kicker">${esc(g.category)}</div>
          <h3>${esc(g.title)}</h3>
          <p>${esc(g.desc)}</p>
        </article>`).join('') || `<div class="empty-note">${t.noNews}</div>`;

      document.getElementById('sportsList').innerHTML = sports.map((s,i)=>`
        <div class="strip-row" onclick="openModal('${s.id}')"><span class="num">${i+1}</span><a>${esc(s.title)}</a></div>`).join('') || `<div class="empty-note">${t.noNews}</div>`;

      document.getElementById('bizList').innerHTML = biz.map((b,i)=>`
        <div class="strip-row" onclick="openModal('${b.id}')"><span class="num">${i+1}</span><a>${esc(b.title)}</a></div>`).join('') || `<div class="empty-note">${t.noNews}</div>`;

      const tick = siteData.ticker && siteData.ticker.length ? siteData.ticker : [t.noNews];
      const doubled = tick.concat(tick);
      document.getElementById('tickerText').innerHTML = doubled.map(x=>`<span>${esc(x)}</span>`).join('');

      if(currentCat !== 'home') navigateTo(currentCat);
    }

    function openModal(id){
      const a = siteData.articles.find(x => String(x.id) === String(id));
      if(!a) return;
      document.getElementById('modalContent').innerHTML = `
        ${a.img ? `<img src="${esc(a.img)}" alt="${esc(a.title)}">` : ''}
        <div class="kicker" style="color:var(--maroon); font-weight:700; font-size:12px; margin: 10px 0 4px; text-transform:uppercase;">
          📌 Category: ${esc(a.category || 'General')}
        </div>
        <h2 style="margin-top:0; font-size:clamp(18px, 4vw, 22px); color:var(--text-main); font-weight:800; line-height:1.3;">${esc(a.title)}</h2>
        <div class="content" style="margin-top:12px; font-size:15px; color:#334155; line-height:1.7;">${esc(a.desc)}</div>
      `;
      document.getElementById('articleModal').classList.add('active');
    }

    function closeModal(){
      document.getElementById('articleModal').classList.remove('active');
    }

    function doSearch(){
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if(!q) return;
      document.getElementById('homeView').style.display = 'none';
      document.getElementById('categoryView').style.display = 'block';
      document.getElementById('catTitle').textContent = `Search: "${q}"`;
      
      categoryFilteredArticles = (siteData.articles || []).filter(a=> 
        (a.title && a.title.toLowerCase().includes(q)) || 
        (a.desc && a.desc.toLowerCase().includes(q)) ||
        (a.category && a.category.toLowerCase().includes(q))
      );
      
      currentCategoryPage = 1;
      renderCategoryGrid();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('articleModal');
      if (event.target === modal) {
        closeModal();
      }
    };

    // App Initialization
    setLanguage(currentLang);
    loadData();
  </script>
</body>
</html>
